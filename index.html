<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bd:#2a2a38;--tx:#e8e8f0;--mu:#6b6b80;--or:#f97316;--bl:#3b82f6;--gn:#10b981;--pu:#a855f7;--rd:#ef4444;--em:#34d399;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px}
body{padding-top:var(--st)}
/* layout */
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:18px;font-weight:700}
.hdr .s{font-size:11px;color:var(--mu);margin-top:1px}
.tabs{background:var(--bg);border-bottom:1px solid var(--bd);display:flex;position:sticky;top:0;z-index:50;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;padding:12px 16px;font-size:12px;font-weight:600;color:var(--mu);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--or);border-bottom-color:var(--or)}
.main{max-width:480px;margin:0 auto;padding:14px 14px calc(var(--sb) + 70px)}
/* pills */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.pill{padding:9px 4px;border-radius:11px;font-size:11px;font-weight:700;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);cursor:pointer;text-align:center;transition:all .15s;position:relative}
.pill .s{display:block;font-weight:400;opacity:.75;margin-top:2px;font-size:10px}
.pill.on{color:#fff;border-color:transparent}
.dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--em);border-radius:50%;border:2px solid var(--bg)}
/* phase info */
.pinfo{border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pbadge{font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
/* progress bar */
.spbox{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sprow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.btr{height:5px;background:var(--bd);border-radius:99px;overflow:hidden}
.bfl{height:100%;border-radius:99px;transition:width .4s}
.spcnt{font-size:11px;color:var(--mu);margin-top:6px}
/* exercise card */
.excard{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:8px}
.exhd{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.exhd:active{background:var(--bg3)}
.exti{flex:1;min-width:0}
.exti b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exti small{font-size:11px;color:var(--mu);display:block;margin-top:2px}
.exbadge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;flex-shrink:0}
.exbadge.p{background:rgba(249,115,22,.2);color:var(--or)}
.exbadge.f{background:rgba(52,211,153,.15);color:var(--em)}
.chev{color:var(--mu);font-size:12px;flex-shrink:0}
/* set rows */
.setrows{border-top:1px solid var(--bd);padding:10px 12px 12px;display:none}
.setrows.open{display:block}
.setrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;margin-bottom:5px;background:rgba(255,255,255,.03)}
.setrow.dk{background:rgba(52,211,153,.07)}
.setnum{width:18px;text-align:center;font-size:11px;color:var(--mu)}
.setrow input{width:62px;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);font-size:13px;text-align:center;border-radius:8px;padding:7px 4px;outline:none;-webkit-appearance:none}
.setrow input:focus{border-color:var(--or)}
.sep{color:var(--mu);font-size:12px}
.dnbtn{margin-left:auto;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dnbtn.u{background:var(--bg3);color:var(--mu);border:1px solid var(--bd)}
.dnbtn.d{background:var(--gn);color:#fff}
/* cardio / notes */
.cdbox{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.cdbox .lbl{font-size:11px;font-weight:700;color:var(--rd);margin-bottom:4px}
.ntbox{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ntbox .lbl{font-size:11px;font-weight:600;color:var(--mu);margin-bottom:6px}
.ntbox textarea{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);font-size:13px;border-radius:9px;padding:9px 12px;outline:none;resize:none;font-family:inherit;line-height:1.5}
.ntbox textarea:focus{border-color:var(--or)}
/* progress tab */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.ctitle{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.lftpills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.lftpill{font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px;border:none;cursor:pointer;background:var(--bg3);color:var(--mu)}
/* programs tab */
.catscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.catscroll::-webkit-scrollbar{display:none}
.cpill{flex-shrink:0;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);cursor:pointer;white-space:nowrap}
.cpill.on{background:var(--or);border-color:var(--or);color:#fff}
.progcard{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.pgbody{padding:14px}
.pgtitle{font-size:14px;font-weight:800;margin-bottom:8px;line-height:1.3}
.pgtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ptag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--bg3);color:var(--mu)}
.pggoal{font-size:12px;color:var(--mu);line-height:1.5;margin-bottom:10px}
.usebtn{width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:800;border:none;cursor:pointer;color:#fff}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;flex-direction:column}
.overlay.show{display:flex}
.ovhd{padding:14px 16px;padding-top:calc(var(--st) + 14px);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0}
.ovback{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ovbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.sessblock{background:var(--bg2);border:1px solid var(--bd);border-radius:13px;overflow:hidden;margin-bottom:10px}
.sesshd{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.sexlist{padding:10px 14px}
.sexrow{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.sexrow:last-child{border-bottom:none}
.ovusebtn{width:100%;padding:15px;color:#fff;font-size:15px;font-weight:800;border:none;border-radius:13px;cursor:pointer;margin-top:8px}
/* toast */
.toast{position:fixed;bottom:calc(var(--sb) + 80px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--bd);border-radius:99px;padding:10px 20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* active program banner */
.apbanner{border-radius:13px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.apweeks{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.apweeks::-webkit-scrollbar{display:none}
.apwk{flex-shrink:0;padding:7px 12px;border-radius:9px;font-size:11px;font-weight:700;border:none;cursor:pointer}

/* ===== PREMIUM UPGRADE ===== */
:root{--gold:#fbbf24;--cyan:#22d3ee;--glass:rgba(255,255,255,.045)}
body{overscroll-behavior-y:none}
.hdr{position:relative;background:linear-gradient(180deg,#12121a 0%,#0d0d13 100%)}
.premium-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.08em;padding:4px 7px;border-radius:99px;background:rgba(251,191,36,.12);color:var(--gold);border:1px solid rgba(251,191,36,.22);margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:120;border-top:1px solid var(--bd);border-bottom:none;background:rgba(10,10,15,.94);backdrop-filter:blur(16px);padding-bottom:var(--sb);justify-content:center}
.tabs button{flex:1;min-width:0;padding:8px 2px 9px;border-bottom:none!important;border-top:2px solid transparent;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ico{font-size:18px;line-height:20px}
.tabs button.on{border-top-color:var(--or)!important;color:var(--or)}
.main{padding-bottom:calc(var(--sb) + 92px);max-width:520px}
.hero{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(168,85,247,.12));border:1px solid rgba(249,115,22,.28);border-radius:18px;padding:18px;margin-bottom:12px;overflow:hidden;position:relative}
.hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(249,115,22,.08);right:-55px;top:-60px}
.hero .ey{font-size:10px;color:var(--or);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.hero h2{font-size:22px;margin:5px 0 6px;line-height:1.15}
.hero p{font-size:12px;color:#9a9aab;line-height:1.5;max-width:82%}
.hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;z-index:2}
.primary,.secondary{border:none;border-radius:11px;padding:11px 14px;font-weight:800;font-size:12px;cursor:pointer}
.primary{background:var(--or);color:#fff}.secondary{background:var(--bg3);color:var(--tx);border:1px solid var(--bd)}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.metric{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:13px}
.metric .micon{font-size:18px;margin-bottom:8px}.metric .val{font-size:22px;font-weight:850;letter-spacing:-.03em}.metric .lab{font-size:10px;color:var(--mu);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}.section-head b{font-size:13px}.section-head span{font-size:10px;color:var(--mu)}
.quickcard{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}.quickcard .qico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--bg3)}.quickcard .qbody{flex:1}.quickcard .qbody b{font-size:13px;display:block}.quickcard .qbody small{font-size:10px;color:var(--mu);display:block;margin-top:3px;line-height:1.35}.quickcard button{border:none;background:var(--bg3);color:var(--tx);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:700}
.timer-float{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 68px);z-index:180;background:rgba(17,17,24,.97);border:1px solid var(--bd);border-radius:16px;padding:11px 12px;display:none;align-items:center;gap:11px;box-shadow:0 10px 35px rgba(0,0,0,.42);backdrop-filter:blur(14px)}
.timer-float.show{display:flex}.timer-ring{width:44px;height:44px;border-radius:50%;border:3px solid var(--or);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:850}.timer-meta{flex:1}.timer-meta b{display:block;font-size:12px}.timer-meta small{font-size:10px;color:var(--mu)}.timer-actions{display:flex;gap:6px}.timer-actions button{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx);font-size:14px}
.toolgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}.tool{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer}.tool .ico{font-size:22px;margin-bottom:10px}.tool b{display:block;font-size:12px}.tool small{display:block;font-size:10px;color:var(--mu);margin-top:4px;line-height:1.4}
.field{margin-bottom:10px}.field label{font-size:10px;color:var(--mu);font-weight:700;display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx);font-size:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--or)}
.kpirow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.kpi{background:var(--bg3);border-radius:10px;padding:10px;text-align:center}.kpi b{font-size:16px;display:block}.kpi small{font-size:9px;color:var(--mu)}
.history-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.history-row:last-child{border-bottom:none}.history-dot{width:8px;height:8px;border-radius:50%;background:var(--or);margin-top:5px;flex-shrink:0}.history-body{flex:1}.history-body b{font-size:12px;display:block}.history-body small{font-size:10px;color:var(--mu);display:block;margin-top:3px}.history-val{font-size:11px;font-weight:750;color:var(--em);white-space:nowrap}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.pr-row:last-child{border-bottom:none}.pr-row b{font-size:12px}.pr-row small{font-size:10px;color:var(--mu);display:block;margin-top:2px}.prv{font-size:14px;font-weight:850;color:var(--gold)}
.weight-chart{width:100%;height:150px}.muted{color:var(--mu);font-size:11px;line-height:1.5}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}.settings-row:last-child{border-bottom:none}.settings-row b{font-size:12px}.settings-row small{display:block;font-size:10px;color:var(--mu);margin-top:3px}.switch{width:44px;height:25px;background:var(--bg3);border:1px solid var(--bd);border-radius:99px;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;left:2px;top:2px;background:#777;transition:.2s}.switch.on{background:rgba(16,185,129,.25);border-color:rgba(16,185,129,.5)}.switch.on:after{left:21px;background:var(--em)}
.install-note{font-size:10px;color:var(--mu);line-height:1.55;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.16);padding:11px;border-radius:11px}
#fileImport{display:none}

/* V3 workout intelligence */
.sessionbar{background:linear-gradient(135deg,rgba(249,115,22,.16),rgba(168,85,247,.09));border:1px solid rgba(249,115,22,.3);border-radius:15px;padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}.sessionbar .live{width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 0 5px rgba(52,211,153,.1)}.sessionbar .sbbody{flex:1}.sessionbar b{font-size:13px;display:block}.sessionbar small{font-size:10px;color:var(--mu)}.sessionbar button{border:0;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800}.finishbtn{background:var(--em);color:#07130f}.startbtn{background:var(--or);color:white}
.smartbox{background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2);border-radius:11px;padding:9px 10px;margin:0 12px 9px;font-size:10px;line-height:1.45;color:#c4b5fd}.smartbox b{color:#ddd6fe}.prevtag{font-size:9px;color:var(--mu);margin-left:auto;white-space:nowrap}.sethead{display:grid;grid-template-columns:26px 48px 1fr 1fr 52px 34px;gap:5px;padding:0 8px 5px;color:var(--mu);font-size:8px;text-transform:uppercase;text-align:center}.setrow.v3{display:grid;grid-template-columns:26px 48px 1fr 1fr 52px 34px;gap:5px}.setrow.v3 input,.setrow.v3 select{width:100%;min-width:0;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);font-size:12px;text-align:center;border-radius:8px;padding:7px 2px;outline:none}.setrow.v3 .dnbtn{margin:0;width:30px}.settype{font-size:10px!important}.session-summary{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}.session-summary h3{font-size:15px;margin-bottom:3px}.session-summary .big{font-size:25px;font-weight:900}.insight{padding:10px 12px;border-radius:11px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.16);font-size:10px;color:#a5f3fc;line-height:1.5;margin-bottom:8px}
@media(min-width:700px){.metric-grid{grid-template-columns:repeat(4,1fr)}.main{max-width:780px}.toolgrid{grid-template-columns:repeat(4,1fr)}}


/* V4 JEVARA IQ */
.v4grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.readiness{background:linear-gradient(135deg,rgba(34,211,238,.09),rgba(168,85,247,.08));border:1px solid rgba(34,211,238,.18);border-radius:15px;padding:14px;margin-bottom:10px}
.readiness .score{font-size:30px;font-weight:900;letter-spacing:-.04em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.scale button{border:1px solid var(--bd);background:var(--bg3);color:var(--mu);border-radius:9px;padding:8px 2px;font-size:11px;font-weight:800}
.scale button.on{background:var(--cyan);color:#071318;border-color:transparent}
.muscle-row{display:grid;grid-template-columns:78px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:10px}
.muscle-bar{height:7px;background:var(--bg3);border-radius:99px;overflow:hidden}.muscle-fill{height:100%;background:linear-gradient(90deg,var(--or),var(--pu));border-radius:99px}
.history-open{margin:0 12px 9px;width:calc(100% - 24px);padding:8px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx);border-radius:9px;font-size:10px;font-weight:800}
.copy-prev{border:1px solid rgba(34,211,238,.25)!important;color:var(--cyan)!important}
.echart{height:165px;width:100%;margin-top:8px}
.coach-alert{padding:11px 12px;border-radius:11px;background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.22);font-size:10px;line-height:1.5;margin-bottom:10px}
.program-builder-row{display:grid;grid-template-columns:1fr 80px 80px;gap:6px;margin-bottom:6px}
.program-builder-row input{width:100%;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx)}
@media(min-width:700px){.v4grid{grid-template-columns:repeat(4,1fr)}}


/* V5 Adaptive Training Engine */
.ai-panel{
  background:linear-gradient(145deg,rgba(168,85,247,.13),rgba(34,211,238,.08));
  border:1px solid rgba(168,85,247,.24);
  border-radius:16px;padding:14px;margin-bottom:12px
}
.ai-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ai-title b{font-size:13px}.ai-badge{font-size:10px;font-weight:900;padding:4px 8px;border-radius:99px;background:rgba(168,85,247,.18);color:#d8b4fe}
.ai-action{font-size:18px;font-weight:900;letter-spacing:-.03em;margin:4px 0}
.ai-reason{font-size:11px;color:var(--mu);line-height:1.55}
.ai-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}

 var goal=p.goal||'recomp',exp=p.experience||'beginner',days=parseInt(p.days)||4,dur=parseInt(p.duration)||60;
 if(goal==='recomp'){scores.rc1+=8;scores.foundation+=5;why.push(JE_LANG==='id'?'Tujuan utama Anda adalah rekomposisi.':'Your primary goal is recomposition.')}
 if(goal==='fatloss'){scores.fl1+=8;scores.rc1+=3;why.push(JE_LANG==='id'?'Prioritas fat loss meningkatkan porsi conditioning.':'Fat-loss priority increases conditioning emphasis.')}
 if(goal==='muscle'){scores.bu1+=7;scores.hp1+=6;scores.foundation+=2;why.push(JE_LANG==='id'?'Fokus muscle gain membutuhkan volume hipertrofi yang lebih tinggi.':'Muscle gain calls for more hypertrophy volume.')}
 if(goal==='strength'){scores.st1+=9;scores.foundation+=3;why.push(JE_LANG==='id'?'Fokus strength mengarahkan program ke progressive strength work.':'Strength focus prioritizes progressive strength work.')}
 if(goal==='fitness'){scores.foundation+=7;scores.rc1+=5;why.push(JE_LANG==='id'?'General fitness membutuhkan struktur yang seimbang.':'General fitness benefits from a balanced structure.')}
 if(exp==='beginner'){scores.rc1+=5;scores.foundation+=6;scores.fl1-=3;scores.bu1-=4;scores.st1-=3;scores.hp1-=2;why.push(JE_LANG==='id'?'Level pemula: kompleksitas dan volume awal dibuat lebih konservatif.':'Beginner level: initial complexity and volume are kept conservative.')}
 if(exp==='intermediate'){scores.foundation+=4;scores.fl1+=2;scores.bu1+=2;scores.st1+=2;scores.hp1+=2}
 if(exp==='advanced'){scores.bu1+=4;scores.st1+=4;scores.hp1+=4;scores.rc1-=2}
 if(days<=3){scores.rc1+=4;scores.foundation+=1;scores.fl1-=2;scores.bu1-=6;scores.hp1-=4;scores.st1-=1}
 if(days===4){scores.rc1+=5;scores.st1+=4;scores.foundation+=2}
 if(days===5){scores.foundation+=5;scores.fl1+=5;scores.hp1+=5}
 if(days>=6){scores.bu1+=8}
 why.push((JE_LANG==='id'?'Ketersediaan '+days+' hari/minggu digunakan untuk mencocokkan frekuensi program.':'Your '+days+' training days/week are used to match program frequency.'));
 if(dur<=45){scores.rc1+=2;scores.foundation+=1;scores.bu1-=2;scores.hp1-=2}
 if(p.equipment!=='fullgym'){scores.rc1+=3;scores.foundation+=2;scores.bu1-=3;scores.st1-=3;scores.hp1-=2;why.push(JE_LANG==='id'?'Ketersediaan alat membatasi program yang terlalu bergantung pada full gym.':'Equipment availability reduces programs that rely heavily on a full gym.')}
 if(p.focus&&p.focus!=='balanced'){scores.hp1+=2;scores.bu1+=1}
 var best=Object.keys(scores).sort(function(a,b){return scores[b]-scores[a]})[0];
 var alt=Object.keys(scores).sort(function(a,b){return scores[b]-scores[a]}).filter(function(x){return x!==best})[0];
 return {id:best,alternative:alt,score:scores[best],why:why.slice(0,4)};
}

function goTab(tab,btn){
  ["dash","log","prog","pgm","tools"].forEach(function(t){g("t-"+t).style.display=t===tab?"block":"none";});

  curTab=tab;

  if(tab==="log")renderLog();
  if(tab==="prog")renderProg();
  if(tab==="pgm")renderPgm();
  if(tab==="tools")renderTools();
  window.scrollTo(0,0);
}

function mkSpbox(dn,tot,col){
  var pct=tot>0?Math.round(dn/tot*100):0;

  b.innerHTML='<div class="sprow"><span style="font-weight:600">'+dn+"/"+tot+' set selesai</span><span style="font-weight:700;color:'+c+'">'+pct+'% selesai</span></div><div class="btr"><div class="bfl" style="width:'+pct+'%;background:'+c+'"></div></div>';
  return b;
}

function exerciseEvents(name){return (premium.events||[]).filter(function(e){return e.name===name&&e.kg>0&&e.reps>0}).slice(0,30);}

function readinessLatest(){return (premium.readiness&&premium.readiness[0])||null;}
function readinessScore(r){if(!r)return null;return Math.round(((r.energy||3)+(r.sleep||3)+(6-(r.soreness||3)))/15*100);}
function saveReadiness(){
 var ie=g('rdEnergy'),is=g('rdSleep'),io=g('rdSore');
 if(!ie||!is||!io){toast('Form readiness belum siap');return;}
 var e=Math.max(1,Math.min(5,parseInt(ie.value)||3));
 var s=Math.max(1,Math.min(5,parseInt(is.value)||3));
 var so=Math.max(1,Math.min(5,parseInt(io.value)||3));
 premium.readiness=premium.readiness||[];
 var now=new Date(),key=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
 var item={ts:Date.now(),energy:e,sleep:s,soreness:so,dateKey:key};
 var idx=premium.readiness.findIndex(function(x){
   var d=new Date(x.ts),k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
   return (x.dateKey||k)===key;
 });
 if(idx>=0)premium.readiness[idx]=item;else premium.readiness.unshift(item);
 premium.readiness=premium.readiness.slice(0,60);
 savePremium();track('readiness_saved',{energy:e,sleep:s,soreness:so,score:readinessScore(item)});
 toast(JE_LANG==='id'?'Kesiapan hari ini tersimpan':'Today’s readiness saved');
 renderDash();
}

function renderExerciseChart(el,ev){
 var d=ev.slice(0,12).reverse();if(d.length<2){el.innerHTML='<div class="muted" style="padding:45px 0;text-align:center">Butuh minimal 2 set historis untuk grafik.</div>';return;}
 var W=340,H=155,p=26,vals=d.map(function(x){return calcE1RM(x.kg,x.reps)}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;

// FIX: repeat-workout sessions store their live set data under keys tagged

function je095AutopilotDone(){
 try{
   var ap=JE095.autopilot,item=ap&&ap.sets[ap.pos];if(!item)return;
   var kgEl=g('apKg'),rpEl=g('apRp'),kg=kgEl&&kgEl.value,rp=rpEl&&rpEl.value;
   if(!kg||!rp){toast('Isi kg dan reps');return;}
   var rir=JE095.effort===null?'2':JE095.effort;
   var k=je095SetKeyData(item.key),was=!!log[k.ok];

   // Save without triggering any tab/home navigation.
   je095SaveInput(item.key,kg,rp,rir,'N');
   if(!was){
     log[k.ok]=true;saveLog();
     try{onSetCompleted(item.name,parseFloat(kg)||0,parseInt(rp)||0,item.key,rir,'N');}catch(err){je095RecordError('autopilot_set_complete',err,{exercise:item.name,key:item.key});}
     try{var ev=(premium.events||[])[0];if(ev&&ev.key===item.key){ev.exerciseId=item.exId;savePremium();}}catch(_){}
   }

   JE095.effort=null;
   var next=ap.sets.findIndex(function(x,idx){return idx>ap.pos&&!log[x.key+'_ok']});
   if(next<0){
     track('autopilot_completed',{sets:ap.sets.length});
     g('ovBody').innerHTML="<div class=\"session-summary\"><h3>Workout sets complete ✓</h3><div class=\"muted\">Semua set dalam sesi ini sudah dicatat. Anda dapat kembali ke Workout atau Finish Workout.</div><button class=\"primary\" style=\"width:100%;margin-top:12px\" onclick=\"closeOv();selectTab('log')\">KEMBALI KE WORKOUT</button></div>";
     return;
   }

   // Advance state first, keep the user inside the guided workout, then show rest.
   ap.pos=next;
   g('ov').classList.remove('show');
   requestAnimationFrame(function(){
     setTimeout(function(){
       try{je096StartRest();}catch(err){je095RecordError('autopilot_rest_start',err);je095RenderAutopilot();}
     },50);
   });
 }catch(err){
   je095RecordError('autopilot_done',err);
   toast('Set tersimpan. Membuka set berikutnya.');
   try{je095RenderAutopilot();}catch(_){}
 }
}

// FIX: one-time cleanup for premium.events entries that were duplicated by
// the old onSetCompleted bug (same sessionId+key logged more than once).
// Keeps the most complete/most recent entry per (sessionId,key) pair and
// drops the rest. Idempotent and safe to run on every load.
function dedupePremiumEvents(){
  try{
    var events=premium.events||[];
    if(!events.length)return;
    var seen={},out=[],changed=false;
    for(var i=0;i<events.length;i++){
      var e=events[i];
      if(!e||!e.key){out.push(e);continue;}
      var k=String(e.sessionId||'')+'::'+String(e.key);
      if(seen[k]!==undefined){changed=true;continue;}
      seen[k]=true;out.push(e);
    }
    if(changed){premium.events=out;savePremium();}
  }catch(e){}
}

function localDate(ts){return new Date(ts).toLocaleDateString('id-ID',{day:'2-digit',month:'short'});}
function localTime(ts){return new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
function weekStart(){var d=new Date(),day=d.getDay()||7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day+1);return d.getTime();}
function calcAllLogged(){var sets=0,vol=0;Object.keys(log).forEach(function(k){if(k.endsWith('_ok')&&log[k]){sets++;var p=k.slice(0,-3);var kg=parseFloat(log[p+'_kg'])||0,rp=parseFloat(log[p+'_rp'])||0;vol+=kg*rp;}});return{sets:sets,vol:vol};}
function calcE1RM(kg,reps){if(!kg||!reps)return 0;return kg*(1+reps/30);}
function updatePR(name,kg,reps){if(!kg||!reps)return false;var e=calcE1RM(kg,reps),old=premium.prs[name];if(!old||e>old.e1rm){premium.prs[name]={kg:kg,reps:reps,e1rm:e,ts:Date.now()};savePremium();return true;}return false;}
function onSetCompleted(name,kg,reps,key,rir,type){
  var ev={ts:Date.now(),exerciseId:je095Slug(name||'exercise'),name:name||'Exercise',kg:kg||0,reps:reps||0,rir:rir===''?null:parseInt(rir),type:type||'N',volume:(type==='W'?0:(kg||0)*(reps||0)),key:key,sessionId:activeSession?activeSession.id:null};
  // FIX: upsert by (sessionId, key) instead of always unshifting a brand new
  // entry. Previously every completion of the same set (e.g. undo + redo to
  // correct a typo) appended a new event, permanently inflating premium.events
  // and any session's reported set/volume totals. Now a repeat completion of
  // the same set updates its existing ledger entry in place.
  var idx=-1;
  if(key){
    for(var i=0;i<premium.events.length;i++){
      var pe=premium.events[i];
      if(pe&&pe.key===key&&String(pe.sessionId||'')===String(ev.sessionId||'')){idx=i;break;}
    }
  }
  var isNewEvent=idx<0;
  if(!isNewEvent)premium.events.splice(idx,1);
  premium.events.unshift(ev);
  premium.events=premium.events.slice(0,500);
  var isPR=updatePR(ev.name,ev.kg,ev.reps);savePremium();
  if(isPR)toast('🏆 Personal Record baru!');
  if(activeSession){
    activeSession.setVolumes=activeSession.setVolumes||{};
    var prevVol=isNewEvent?0:(activeSession.setVolumes[key]||0);
    if(isNewEvent)activeSession.sets=(activeSession.sets||0)+1;
    activeSession.volume=Math.max(0,(activeSession.volume||0)-prevVol+ev.volume);
    if(key)activeSession.setVolumes[key]=ev.volume;
  }
  if(premium.settings.autoRest && !(typeof JE095!=='undefined' && JE095.autopilot))startRest(suggestedRest(ev.name),ev.name);
}

// V5 ADAPTIVE TRAINING ENGINE
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function avg(arr){return arr.length?arr.reduce(function(a,b){return a+b},0)/arr.length:0}
function recentReadiness(n){return (premium.readiness||[]).slice(0,n||7).map(readinessScore).filter(function(x){return x!==null})}
function recentSessions(n){return (premium.sessions||[]).slice(0,n||6)}
function sessionTrend(){
 var s=recentSessions(6); if(s.length<2)return 0;
 var a=s.slice(0,Math.ceil(s.length/2)),b=s.slice(Math.ceil(s.length/2));
 var av1=avg(a.map(function(x){return x.volume||0})),av2=avg(b.map(function(x){return x.volume||0}));
 if(!av2)return 0; return ((av1-av2)/av2)*100;
}
function performanceFor(name,n){
 var ev=exerciseEvents(name).slice(0,n||12);
 return ev.map(function(e){return {ts:e.ts,kg:e.kg,reps:e.reps,rir:e.rir,e1:calcE1RM(e.kg,e.reps),type:e.type||'N'}})
}
function bestRecentPerf(name,count){
 var p=performanceFor(name,count||8).filter(function(x){return x.type!=='W'});
 if(!p.length)return null;
 return p.reduce(function(a,b){return b.e1>a.e1?b:a},p[0]);
}
function previousBlockPerf(name){
 var p=performanceFor(name,16).filter(function(x){return x.type!=='W'});
 if(p.length<4)return {current:null,previous:null,delta:null};
 var cur=p.slice(0,Math.min(4,p.length)),prev=p.slice(4,Math.min(8,p.length));
 if(!prev.length)return {current:avg(cur.map(function(x){return x.e1})),previous:null,delta:null};
 var c=avg(cur.map(function(x){return x.e1})),pr=avg(prev.map(function(x){return x.e1}));
 return {current:c,previous:pr,delta:pr?((c-pr)/pr)*100:null};
}
function rirLoad(name){
 var p=performanceFor(name,8).filter(function(x){return x.rir!==null&&x.rir!==undefined&&x.type!=='W'});
 if(!p.length)return null; return avg(p.map(function(x){return Number(x.rir)}));
}

function parseTargetReps(txt){
  var s=String(txt||'').replace(/–/g,'-');
  var m=s.match(/(\d+)\s*-\s*(\d+)/);
  if(m)return {min:parseInt(m[1]),max:parseInt(m[2])};
  var one=s.match(/(\d+)/);
  var v=one?parseInt(one[1]):10;
  return {min:v,max:v};
}

function adaptationDecision(name,targetText){
 var prev=lastEventFor(name),trend=previousBlockPerf(name),ravg=rirLoad(name);
 var rd=readinessScore(readinessLatest()); if(rd===null)rd=70;
 var target=parseTargetReps(targetText||'8-12');
 var action='PERTAHANKAN',delta=0,reason=[],confidence=55;
 if(!prev){return {action:'MULAI KONSERVATIF',delta:0,reason:'Belum ada histori yang cukup. Gunakan beban yang memungkinkan target rep tercapai dengan teknik baik dan RIR 2–3.',confidence:35,readiness:rd,trend:null,rir:null}}
 var hitTop=prev.reps>=target.max;
 if(hitTop && (prev.rir===null || prev.rir>=1) && rd>=60){action='NAIKKAN BEBAN';delta=smallestJump(name);reason.push('target rep atas tercapai');confidence+=18}
 if(prev.rir!==null && prev.rir<=0){action='PERTAHANKAN';delta=0;reason.push('set terakhir mencapai failure');confidence+=8}
 if(ravg!==null && ravg<1.2 && rd<60){action='KURANGI INTENSITAS';delta=-smallestJump(name);reason.push('RIR rendah dan readiness rendah');confidence+=18}
 if(trend.delta!==null){
   if(trend.delta>3){reason.push('e1RM membaik '+trend.delta.toFixed(1)+'%');confidence+=8}
   if(trend.delta<-4){action='KURANGI VOLUME';delta=0;reason.push('e1RM turun '+Math.abs(trend.delta).toFixed(1)+'%');confidence+=15}
 }
 if(rd<45){action='RECOVERY / DELOAD';delta=0;reason.push('readiness '+rd+'/100');confidence+=20}
 if(!reason.length)reason.push('performa relatif stabil');
 return {action:action,delta:delta,reason:reason.join(' • '),confidence:clamp(confidence,30,95),readiness:rd,trend:trend.delta,rir:ravg}
}
function smallestJump(name){
 var n=String(name||'').toLowerCase();
 if(n.indexOf('lateral')>=0||n.indexOf('curl')>=0||n.indexOf('tricep')>=0||n.indexOf('fly')>=0)return 1;
 if(n.indexOf('db ')>=0||n.indexOf('dumbbell')>=0)return 2;
 return 2.5;
}
function adaptiveSuggestedLoad(name,targetText){
 var prev=lastEventFor(name); if(!prev)return null;
 var d=adaptationDecision(name,targetText);
 return Math.max(0,Math.round((Number(prev.kg)+(d.delta||0))*2)/2);
}
function deloadScore(){
 var rr=recentReadiness(5),sess=recentSessions(5),score=0,reasons=[];
 if(rr.length>=3){var ar=avg(rr);if(ar<55){score+=2;reasons.push('readiness rata-rata '+Math.round(ar));}else if(ar<65){score+=1;reasons.push('readiness mulai menurun')}}
 if(sess.length>=4){
   var long=sess.filter(function(x){return (x.duration||0)>5400}).length;
   if(long>=3){score+=1;reasons.push('beberapa sesi >90 menit')}
 }
 var neg=0;
 ['Bench Press','Deadlift','BB Squat heavy','Barbell Bench Press'].forEach(function(n){var t=previousBlockPerf(n);if(t.delta!==null&&t.delta<-4)neg++});
 if(neg>=2){score+=2;reasons.push('beberapa lift utama menurun')}
 return {score:score,reasons:reasons};
}
function deloadRecommendation(){

 if(d.score>=4)return {level:'HIGH',title:'Pertimbangkan Deload',text:'Kurangi volume sekitar 30–40% dan hindari failure selama 4–7 hari. '+d.reasons.join(' • ')};

 return {level:'LOW',title:'Recovery Stable',text:'Belum ada sinyal kuat untuk deload. Lanjutkan progres bertahap sambil memantau readiness dan performa.'};
}

}

 var x={CALIBRATE:['Kalibrasi','Calibrate'],RECALIBRATE:['Kalibrasi Ulang','Recalibrate'],RECOVER:['Pulihkan Hari Ini','Recover Today'],HOLD:['Pertahankan','Hold'],BUILD_REPS:['Tambah Repetisi','Build Reps'],BUILD_LOAD:['Tambah Beban','Build Load'],DELOAD_CHECK:['Cek Recovery Week','Check Recovery Week']};

<script>
